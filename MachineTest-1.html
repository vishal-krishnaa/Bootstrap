<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MachineTest-Backup1</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body class="bg-primary" style="margin-top:100px;">
    <div class="container bg-white">
        <div class="px-5">
             <div class="row pt-5">
                <div class="col-md-5">
                    <h1 class="font-weight-bold">Sign Up</h1>
                </div>
            </div>
            <div class="row">
                <div class="col-md-8 pb-3">
                    <p class="text-muted">Please fill in this form to create an account!</p>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <input type="text" class="form-control mr-5 bg-light border-0" name="fname" placeholder="First Name">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <input type="text" class="form-control bg-light border-0" name="lname" placeholder="Last Name">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <input type="email" class="form-control bg-light border-0" name="Email" placeholder="Email">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <input type="password" class="form-control bg-light border-0" name="password" placeholder="Password">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <input type="password" class="form-control bg-light border-0" name="password" placeholder="Confirm Password">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-8 pb-2">
                    <div class="form-check">
                         <input type="checkbox" id="remm" class="form-check-input mt-2">
                         <label for="remm"><span class="text-muted">I accept the</span> <a href="#">Terms of Use </a><span class="text-muted">&</span><a href="#"> Privacy Policy</a></label>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-md-3 pb-5">
                    <button type="button" class="btn btn-primary btn-block text-white font-weight-bold">Sign Up</button>
                </div>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row">
                <div class="col-md-12  pt-2 d-flex justify-content-center">
                    <p class="text-white ">Already have an account? <a href="#" class="text-white"><u>Login here</u></a></p>
                </div>
            </div>
        </div>
    
    
</body>
</html>
