<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Ride</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>

</head>
<body>
    <div class="container mt-5">
        <h3 class="text-center">Travel Planner</h3>
    </div>
      <div id="promoCarousel" class="carousel slide" data-ride="carousel">
        <ol class="carousel-indicators">
          <li data-target="#Carousel" data-slide-to="0" class="active"></li>
          <li data-target="#Carousel" data-slide-to="1"></li>
          <li data-target="#Carousel" data-slide-to="2"></li>
        </ol>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img class="d-block w-100 promo-img" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1200&q=60&auto=format&fit=crop" alt="Beach">
            <div class="carousel-caption d-none d-md-block text-left">
              <h5 class="text-white">Beach</h5>
              <button class="btn btn-sm btn-primary" data-toggle="modal" data-target="#bookModal">Book Now</button>
            </div>
          </div>

          <div class="carousel-item">
            <img class="d-block w-100 promo-img" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=1200&q=60&auto=format&fit=crop" alt="Mountains">
            <div class="carousel-caption d-none d-md-block">
              <h5 class="text-white">Mountains</h5>
              <button class="btn btn-sm btn-primary" data-toggle="modal" data-target="#bookModal">Book Now</button>
            </div>
          </div>

          <div class="carousel-item">
            <img class="d-block w-100 promo-img" src="https://imgs.search.brave.com/CfsbfSGcshdUorga1TVuTASquXNkNV0LPTnsjaX4dEE/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9wcm94/eS5jZG4uem9zdGVs/LmNvbS96b3N0ZWwv/Z2FsbGVyeS9pbWFn/ZXMvRDNoZWVSMm9R/R1dZYnpEdWRIbGI3/Zy90aGUtdWx0aW1h/dGUtYWR2ZW50dXJl/LWRlc3RpbmF0aW9u/LTIwMjAxMTEyMTAy/MDA5LmpwZz9oPTk2/MA" alt="City">
            <div class="carousel-caption d-none d-md-block text-right">
              <h5 class="text-white">Mannali</h5>
              <button class="btn btn-sm btn-primary" data-toggle="modal" data-target="#bookModal">Book Now</button>
            </div>
          </div>
        </div>

        <a class="carousel-control-prev" href="#Carousel" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#Carousel" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>

      <div class="modal fade" id="bookModal" tabindex="-1" role="dialog" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Booking Details</h5>
              <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                <span aria-hidden="true">&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <p>Book</p>
            </div>
            <div class="modal-footer">
              <a href="#" class="btn btn-success">Book Akkiko</a>
              <button type="button" class="btn btn-secondary" data-dismiss="modal">Vendaenki Venda</button>
            </div>
          </div>
        </div>
      </div>
</body>
</html>
